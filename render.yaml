services:
  # Frontend Service
  - type: web
    name: atlaspi-fronted
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    buildCommand: "npm ci && npm run build 2>/dev/null || true"
    startCommand: "nginx -g 'daemon off;'"
    plan: free
    region: oregon
    healthCheckPath: /health
    port: 3000
    envVars:
      - key: VITE_PI_API
        value: "https://api.minepi.com"
      - key: VITE_APP_ID
        value: "atlaspi"
      - key: VITE_API_BASE
        value: "https://atlaspi-backend.onrender.com"
      - key: NODE_ENV
        value: "production"

  # Backend Service
  - type: web
    name: atlaspi-backend
    runtime: node
    rootDir: backend
    buildCommand: "npm ci"
    startCommand: "npm start"
    plan: free
    region: oregon
    healthCheckPath: /api/health
    port: 3000
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "3000"
      - key: APP_MODE
        value: "pirc2-sandbox"
      - key: PI_NETWORK
        value: "mainnet"
      - key: PI_SANDBOX
        value: "true"
      - key: PI_API_BASE_URL
        value: "https://api.minepi.com"
      - key: FRONTEND_URL
        value: "https://atlaspi.onrender.com"
      - key: PIRC2_AUTH_ENABLED
        value: "true"
      - key: PIRC2_PAYMENTS_ENABLED
        value: "true"
      - key: PIRC2_MERCHANT_PI_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: "info"
      - key: DEBUG_MODE
        value: "true"
      - key: PI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
